<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>GMod CardEngine Expansion: GMod Base Set</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #181c20;
            color: #f3f3f3;
            margin: 0;
            padding: 0;
        }

        header {
            background: #23272b;
            padding: 2rem 1rem 1rem 1rem;
            text-align: center;
            box-shadow: 0 2px 8px #0002;
        }

        header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2.5rem;
            letter-spacing: 1px;
        }

        header p {
            margin: 0;
            color: #b0b8c1;
            font-size: 1.1rem;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 2rem;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: #23272b;
            box-shadow: 0 4px 16px #0004;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .card:hover {
            transform: translateY(-6px) scale(1.25);
            box-shadow: 0 8px 32px #0006;
        }

        .card-img {
            width: 100%;
            aspect-ratio: 372 / 512;
            overflow: hidden;
            background: linear-gradient(135deg, #3a3f44 60%, #23272b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <header>
        <h1>GMod CardEngine Expansion: GMod Base Set</h1>
    </header>
    <main>
        <div class="card-grid"
             id="cardGrid">
            <!-- Cards will be injected here by JS -->
        </div>
    </main>
    <script>
        const grid = document.getElementById('cardGrid');

        fetch('cards.json')
            .then(res => res.json())
            .then(cards => {
                cards.forEach(card => {
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'card';
                    cardDiv.title = card.img;
                    cardDiv.innerHTML = `
                                <div class="card-img">
                                    <img
                                        src="design/${card.img}"
                                        alt="${card.img}"
                                        style="width:100%;height:100%;object-fit:cover;object-position:left;display:block;"
                                        onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'font-size:4rem; color:#7ecfff;\'>❓</div>';"></div>
                            `;
                    grid.appendChild(cardDiv);
                });
            });
    </script>
</body>

</html>
